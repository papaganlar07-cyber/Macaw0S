name: Kernel CI

on:
  pull_request:
  push:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm qemu-system-x86

      - name: Build i686 kernel
        run: make

      - name: QEMU smoke test
        run: ./scripts/qemu-smoke.sh
