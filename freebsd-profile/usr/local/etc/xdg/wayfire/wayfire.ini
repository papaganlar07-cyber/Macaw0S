[core]
plugins = alpha animate autostart command cube decoration expo fast-switcher grid idle invert move place resize switcher vswitch window-rules wobbly zoom
xwayland = true

[autostart]
wing_panel = wing-panel
nest_launcher = nest-launcher --daemon
perch_dock = perch-dock
background = swaybg -i /usr/local/share/backgrounds/macaw0s/aviary-default.png -m fill

[decoration]
border_size = 2
active_color = \\#2FD17CFF
inactive_color = \\#153A34AA

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = alacritty
binding_launcher = <super> KEY_SPACE
command_launcher = nest-launcher --show
